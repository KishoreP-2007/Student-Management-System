<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 40px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #4a3aff;
            margin-bottom: 30px;
        }

        h2 {
            color: #333;
            margin-top: 30px;
        }

        form {
            display: grid;
            gap: 12px;
            margin-bottom: 30px;
        }

        input,
        button {
            padding: 12px;
            font-size: 16px;
            border-radius: 7px;
        }

        input {
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.4);
        }

        button {
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(102, 126, 234, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 8px;
        }

        th,
        td {
            border: 1px solid #e0e0e0;
            padding: 12px;
            text-align: left;
        }

        th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        tr:nth-child(even) {
            background: #f7f7ff;
        }

        tr:hover {
            background: #eeeeff;
        }

        .delete-btn {
            background: #e74c3c;
            padding: 8px 12px;
        }

        .delete-btn:hover {
            background: #c0392b;
            box-shadow: none;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
            }

            table {
                font-size: 14px;
            }

            th,
            td {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎓 Student Management System</h1>

        <form id="studentForm">

            <input
                type="text"
                id="name"
                placeholder="Student Name"
                required
            >

            <input
                type="text"
                id="department"
                placeholder="Department"
                required
            >

            <input
                type="number"
                id="year"
                placeholder="Year"
                min="1"
                max="5"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <button type="submit">
                ➕ Add Student
            </button>

        </form>

        <h2>📋 Students</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Year</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTableBody">
            </tbody>

        </table>

    </div>

    <script>

        const studentForm =
            document.getElementById("studentForm");

        const studentTableBody =
            document.getElementById("studentTableBody");


        // Load students
        async function loadStudents() {

            try {

                const response =
                    await fetch("/students");

                const students =
                    await response.json();

                studentTableBody.innerHTML = "";

                students.forEach(student => {

                    const row =
                        document.createElement("tr");

                    row.innerHTML = `
                        <td>${student.id}</td>
                        <td>${student.name}</td>
                        <td>${student.department}</td>
                        <td>${student.year}</td>
                        <td>${student.email}</td>

                        <td>
                            <button
                                class="delete-btn"
                                onclick="deleteStudent(${student.id})">
                                🗑️ Delete
                            </button>
                        </td>
                    `;

                    studentTableBody.appendChild(row);

                });

            } catch (error) {

                console.error(
                    "Error loading students:",
                    error
                );

            }
        }


        // Add student
        studentForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const student = {

                    name:
                        document.getElementById("name").value,

                    department:
                        document.getElementById("department").value,

                    year:
                        Number(
                            document.getElementById("year").value
                        ),

                    email:
                        document.getElementById("email").value

                };


                try {

                    const response =
                        await fetch("/students", {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(student)

                        });


                    if (response.ok) {

                        studentForm.reset();

                        loadStudents();

                    } else {

                        alert(
                            "Failed to add student"
                        );

                    }

                } catch (error) {

                    console.error(
                        "Error:",
                        error
                    );

                }

            }
        );


        // Delete student
        async function deleteStudent(id) {

            if (
                !confirm(
                    "Are you sure you want to delete this student?"
                )
            ) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `/students/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                if (response.ok) {

                    loadStudents();

                } else {

                    alert(
                        "Failed to delete student"
                    );

                }

            } catch (error) {

                console.error(
                    "Error:",
                    error
                );

            }

        }


        // Initial load
        loadStudents();

    </script>

</body>

</html>
